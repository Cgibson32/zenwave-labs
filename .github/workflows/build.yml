name: Build plugins

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  dsp-tests:
    name: DSP unit tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run tests (no JUCE needed)
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Ilibs/zenwave_dsp/include tests/dsp_tests.cpp -o dsp_tests
          ./dsp_tests

  plugin-qa:
    name: Plugin QA sweep (Linux, headless)
    runs-on: ubuntu-latest
    needs: dsp-tests
    steps:
      - uses: actions/checkout@v4
      - name: Install JUCE Linux deps
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libx11-dev libxrandr-dev libxinerama-dev libxcursor-dev libxext-dev libfreetype6-dev libfontconfig1-dev libgl1-mesa-dev libcurl4-openssl-dev xvfb
      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release -DZENWAVE_BUILD_TESTS=OFF -DZENWAVE_BUILD_QA=ON
      - name: Build QA tools
        run: cmake --build build --config Release --target DriftQA UmbraQA CoreQA --parallel 4
      - name: Run QA (every preset, every parameter, bypass, state)
        run: |
          xvfb-run -a build/tools/qa/DriftQA_artefacts/Release/DriftQA
          xvfb-run -a build/tools/qa/UmbraQA_artefacts/Release/UmbraQA
          xvfb-run -a build/tools/qa/CoreQA_artefacts/Release/CoreQA

  build:
    name: ${{ matrix.name }}
    needs: [dsp-tests, plugin-qa]
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (VST3 + AU, universal)
            os: macos-15
            artifact: ZenWave-macOS
          - name: Windows (VST3)
            os: windows-latest
            artifact: ZenWave-Windows
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DZENWAVE_BUILD_TESTS=OFF -DCMAKE_MSVC_RUNTIME_LIBRARY=MultiThreaded

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --target Drift_VST3 Drift_Standalone Umbra_VST3 Umbra_Standalone Core_VST3 Core_Standalone --parallel 4

      - name: Build AU (macOS only)
        if: runner.os == 'macOS'
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --target Drift_AU Umbra_AU Core_AU --parallel 4

      # --- Code signing & notarization (macOS). Secrets are added once in the repo settings:
      #   APPLE_CERT_P12 (base64), APPLE_CERT_PASSWORD, APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD
      - name: Sign and notarize (macOS, only when secrets exist)
        if: runner.os == 'macOS' && env.APPLE_CERT_P12 != ''
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          bash tools/mac_sign_notarize.sh build/plugins/drift/Drift_artefacts/Release
          bash tools/mac_sign_notarize.sh build/plugins/umbra/Umbra_artefacts/Release
          bash tools/mac_sign_notarize.sh build/plugins/core/Core_artefacts/Release

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p out
          for P in Drift Umbra Core; do
            plug=$(echo $P | tr 'A-Z' 'a-z')
            A=build/plugins/$plug/${P}_artefacts
            [ -d "$A/Release" ] && A="$A/Release"
            mkdir -p out/VST3 out/Standalone
            cp -R "$A"/VST3/*.vst3 out/VST3/
            cp -R "$A"/Standalone/* out/Standalone/ || true
            if [ "$RUNNER_OS" == "macOS" ]; then mkdir -p out/AU; cp -R "$A"/AU/*.component out/AU/; fi
          done
          find out -maxdepth 2
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/

  release:
    name: Attach to GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - name: Zip
        run: |
          cd dist
          for d in */; do (cd "$d" && zip -r "../${d%/}.zip" .); done
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
