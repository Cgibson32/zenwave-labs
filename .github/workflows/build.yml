name: Build plugins

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

env:
  BUILD_TYPE: Release

jobs:
  dsp-tests:
    name: DSP unit tests (Linux)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build and run tests (no JUCE needed)
        run: |
          g++ -std=c++20 -O2 -Wall -Wextra -Ilibs/zenwave_dsp/include tests/dsp_tests.cpp -o dsp_tests
          ./dsp_tests

  build:
    name: ${{ matrix.name }}
    needs: dsp-tests
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS (VST3 + AU, universal)
            os: macos-14
            artifact: ZenWave-macOS
          - name: Windows (VST3)
            os: windows-latest
            artifact: ZenWave-Windows
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=${{ env.BUILD_TYPE }} -DZENWAVE_BUILD_TESTS=OFF

      - name: Build
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --target Drift_VST3 Drift_Standalone Umbra_VST3 Umbra_Standalone --parallel 4

      - name: Build AU (macOS only)
        if: runner.os == 'macOS'
        run: cmake --build build --config ${{ env.BUILD_TYPE }} --target Drift_AU Umbra_AU --parallel 4

      # --- Code signing & notarization (macOS). Secrets are added once in the repo settings:
      #   APPLE_CERT_P12 (base64), APPLE_CERT_PASSWORD, APPLE_ID, APPLE_TEAM_ID, APPLE_APP_PASSWORD
      - name: Sign and notarize (macOS, only when secrets exist)
        if: runner.os == 'macOS' && env.APPLE_CERT_P12 != ''
        env:
          APPLE_CERT_P12: ${{ secrets.APPLE_CERT_P12 }}
          APPLE_CERT_PASSWORD: ${{ secrets.APPLE_CERT_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          bash tools/mac_sign_notarize.sh build/plugins/drift/Drift_artefacts/Release
          bash tools/mac_sign_notarize.sh build/plugins/umbra/Umbra_artefacts/Release

      - name: Collect artifacts
        shell: bash
        run: |
          mkdir -p out
          for plug in drift umbra; do
            P=$(echo $plug | sed 's/./\U&/')
            cp -R build/plugins/$plug/${P}_artefacts/Release/VST3/*.vst3 out/ 2>/dev/null || cp -R build/plugins/$plug/${P}_artefacts/VST3/*.vst3 out/
            if [ "$RUNNER_OS" == "macOS" ]; then cp -R build/plugins/$plug/${P}_artefacts/Release/AU/*.component out/; fi
          done
          ls -la out

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: out/

  release:
    name: Attach to GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with: { path: dist }
      - name: Zip
        run: |
          cd dist
          for d in */; do (cd "$d" && zip -r "../${d%/}.zip" .); done
          ls -la
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip
